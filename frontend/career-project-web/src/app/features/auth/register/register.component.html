<div class="auth-page">
  <header class="brand-header">
    <div class="brand">
      <span class="brand-icon">💼</span>
      <span class="brand-name">კარიერა</span>
    </div>
  </header>

  <main class="auth-content">
    <div class="auth-card">
      <h1 class="auth-title">რეგისტრაცია</h1>
      <p class="auth-subtitle">შექმენით ახალი ანგარიში</p>

      <div class="role-toggle">
        <button
          type="button"
          class="role-option"
          [class.active]="selectedRole() === 'Person'"
          (click)="selectRole('Person')"
        >
          კანდიდატი
        </button>
        <button
          type="button"
          class="role-option"
          [class.active]="selectedRole() === 'Company'"
          (click)="selectRole('Company')"
        >
          კომპანია
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span class="field-label">{{ selectedRole() === 'Person' ? 'სრული სახელი' : 'კომპანიის დასახელება' }}</span>
          <input
            type="text"
            formControlName="name"
            class="field-input"
            [placeholder]="selectedRole() === 'Person' ? 'ნინო გიორგიაშვილი' : 'შპს მაგალითი'"
          />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="field-error">ეს ველი აუცილებელია</span>
          }
        </label>

        <label class="field">
          <span class="field-label">ელ.ფოსტა</span>
          <input
            type="email"
            formControlName="email"
            class="field-input"
            placeholder="example@email.com"
            autocomplete="email"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="field-error">მიუთითეთ სწორი ელ.ფოსტა</span>
          }
        </label>

        <label class="field">
          <span class="field-label">პაროლი</span>
          <input
            type="password"
            formControlName="password"
            class="field-input"
            placeholder="მინიმუმ 8 სიმბოლო"
            autocomplete="new-password"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="field-error">პაროლი უნდა შეიცავდეს მინიმუმ 8 სიმბოლოს</span>
          }
        </label>

        @if (errorMessage()) {
          <div class="form-error">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'იტვირთება...' : 'რეგისტრაცია' }}
        </button>
      </form>

      <p class="auth-switch">
        უკვე გაქვთ ანგარიში? <a routerLink="/login">შედით</a>
      </p>
    </div>
  </main>
</div>
